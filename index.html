<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GAME ZONE - Connexion</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <main class="auth-container">

        <div class="logo">
            🎮 GAME ZONE
        </div>

        <p class="subtitle">
            Connecte-toi à ton compte pour accéder à tes jeux
        </p>


        <!-- EMAIL -->

        <div class="input-group">

            <label for="loginEmail">
                Adresse Gmail
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="exemple@gmail.com"
                autocomplete="email"
            >

        </div>


        <!-- MOT DE PASSE -->

        <div class="input-group">

            <label for="loginPassword">
                Mot de passe
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Ton mot de passe"
                autocomplete="current-password"
            >

        </div>


        <!-- MESSAGE -->

        <div
            id="loginMessage"
            class="message"
        ></div>


        <!-- CONNEXION -->

        <button
            id="loginButton"
            class="main-button"
            type="button"
        >
            🎮 SE CONNECTER
        </button>


        <div class="separator">
            <span>OU</span>
        </div>


        <!-- INSCRIPTION -->

        <button
            id="signupButton"
            class="signup-button"
            type="button"
        >
            ✨ CRÉER UN COMPTE
        </button>

    </main>


    <script src="script.js"></script>

</body>
</html>
